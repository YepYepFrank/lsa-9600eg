# 转换程序测试用的 Mosquitto —— 与 EG 正式总线（deploy/eg/mosquitto.conf）同一份配置：
# 不鉴权、持久化、放宽排队上限。容器里听 1883，宿主机上映射成 1884（compose.yaml），和 EG 上一样。
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
max_queued_messages 50000
log_dest stdout
log_type error
log_type warning
log_type notice

# 开发用：不鉴权。EG 上的正式配置（账号、只听本机与 LAN1）在 G6 的部署包里
listener 1883
allow_anonymous true
# 持久化 + 放宽排队上限：IoT Gateway 用持久会话，它停着时 Mosquitto 替它排着数据（默认只排 1000 条，约 10 分钟）
persistence true
persistence_location /mosquitto/data/
max_queued_messages 50000
log_dest stdout
log_type error
log_type warning
log_type notice

# EG 本机总线（正式）。只在本机与容器网络里可达：宿主机端口只绑 127.0.0.1:1884（compose.yaml），
# 同事的采集程序、eg-agent、IoT Gateway 用它；摄像机网 LAN1、上行网 LAN2 都连不到，所以不另设账号。
listener 1883
allow_anonymous true
# 持久化 + 放宽排队上限：IoT Gateway、eg-agent 用持久会话，它们重启那几秒 Mosquitto 替它们排着（G1 实测）
persistence true
persistence_location /mosquitto/data/
max_queued_messages 50000
log_dest stdout
log_type error
log_type warning
log_type notice

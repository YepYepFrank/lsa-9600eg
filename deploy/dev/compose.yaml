# 开发用的 EG 样机（G0）：只起 EG 上除 TB Edge 以外的容器，Edge 借用子站开发环境里本柜的 Edge 容器（如 lsa-edge-ah03）。
#
#   pnpm dev:config   从子站后端仓库拷 eg.yaml、写开发用 local.yaml（默认 AH03）
#   pnpm dev:up       生成 IoT Gateway 配置并起容器；pnpm dev:down 停
#
# 链路：emu（扮演同事的转换程序，宿主机）─► mosquitto ─► tb-gateway ─► lsa-edge-<柜号>（子站开发环境）─► 子站 TB
#       eg-agent（宿主机）也连 mosquitto
# 要加入子站开发环境的 docker 网络才能找到 Edge 容器，所以网络是 external 的 lsa9600sp_default。
name: lsa-eg-dev

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: lsa-eg-mosquitto
    restart: unless-stopped
    volumes:
      - ../mosquitto/mosquitto.dev.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      # 宿主机上的 eg-agent、emu 连这里（EG 上是 127.0.0.1:1884）
      - '127.0.0.1:11883:1883'
    networks: [sp]

  tb-gateway:
    image: thingsboard/tb-gateway:${TB_GATEWAY_VERSION:-latest}
    container_name: lsa-eg-gateway
    restart: unless-stopped
    depends_on: [mosquitto]
    environment:
      TZ: Asia/Shanghai
    volumes:
      # eg-agent 生成的配置（run/gateway/config，含 .firstlaunch 防止镜像用默认配置覆盖）
      - ../../run/gateway/config:/thingsboard_gateway/config
      # 自定义连接器：EG 自身数据经网关自己的会话上送（extensions/lsa/lsa_self_connector.py）
      - ../tb-gateway/extensions/lsa:/thingsboard_gateway/extensions/lsa:ro
      - gw-logs:/thingsboard_gateway/logs
    networks: [sp]

volumes:
  gw-logs:

networks:
  sp:
    name: lsa9600sp_default
    external: true

# 开发用的 EG 样机（I1 起：EG 跑独立 ThingsBoard CE，后端库 docs/EG独立TB调整方案.md）。
#
#   pnpm dev:config   从子站后端仓库拷 eg.yaml、写开发用 local.yaml（默认 AH03）
#   pnpm dev:up       生成 IoT Gateway 配置、首次先建本地 TB 的库，再起全部容器；pnpm dev:down 停
#
# 链路：emu（扮演同事的转换程序，宿主机）─► mosquitto ─► tb-gateway ─► eg-tb（EG 本地 TB：存数、本地 7 类告警、本地页面）
#       eg-agent（宿主机）也连 mosquitto，上送子站走它（I2）
#       视频（G4）：camera（测试源扮摄像机）◀─ mediamtx（EG 这一级，按需拉）◀─ 子站 mediamtx；eg-video（宿主机）生成 mediamtx 配置、测温、探测
# 本地 TB 的设备、设备配置（含告警规则）、规则链由后端库 provision:eg 按 eg.yaml 建（它连 127.0.0.1:18080）。
# 与子站开发环境不共用任何容器、库和网络：本地 TB 用自己的 PostgreSQL（与 EG 上一样），子站那边停了也照样跑。
name: lsa-eg-dev

x-tb-env: &tb-env
  TB_SERVICE_ID: lsa-eg-tb
  TB_SERVICE_TYPE: monolith
  TB_QUEUE_TYPE: in-memory
  DATABASE_TS_TYPE: sql
  SPRING_DATASOURCE_URL: jdbc:postgresql://eg-postgres:5432/thingsboard
  SPRING_DATASOURCE_USERNAME: postgres
  SPRING_DATASOURCE_PASSWORD: ${EG_PG_PASSWORD:-lsa-eg-dev}
  SPRING_DATASOURCE_MAXIMUM_POOL_SIZE: '5'
  # 本项目只用 MQTT 接 IoT Gateway
  COAP_ENABLED: 'false'
  LWM2M_ENABLED: 'false'
  SNMP_ENABLED: 'false'
  # EG 本地只留 7 天（≥ 2 年由子站保存）
  SQL_TTL_TS_ENABLED: 'true'
  SQL_TTL_TS_TS_KEY_VALUE_TTL: ${EG_TS_TTL_S:-604800}
  # 瘦身参数：I1 实测空载 688 MB、带一面柜数据 846–904 MB（评审记录 I1-1）
  JAVA_OPTS: ${EG_TB_JAVA_OPTS:--Xms192m -Xmx384m -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=96m -Xss512k -XX:MaxDirectMemorySize=64m -XX:TieredStopAtLevel=1}
  TZ: Asia/Shanghai

services:
  eg-postgres:
    image: postgres:16
    container_name: lsa-eg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${EG_PG_PASSWORD:-lsa-eg-dev}
      POSTGRES_DB: thingsboard
      TZ: Asia/Shanghai
    # 本地库不对外（EG 上也一样）
    volumes:
      - eg-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d thingsboard']
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [eg]

  # 一次性建库（首次启动）。scripts/dev.mjs up 检测到库是空的就先跑它
  eg-tb-install:
    image: thingsboard/tb-node:${TB_VERSION:-4.2.2.5}
    container_name: lsa-eg-tb-install
    profiles: ['install']
    depends_on:
      eg-postgres:
        condition: service_healthy
    environment:
      <<: *tb-env
      INSTALL_TB: 'true'
      LOAD_DEMO: 'false'
    volumes:
      - eg-tb-data:/data
    restart: 'no'
    networks: [eg]

  eg-tb:
    image: thingsboard/tb-node:${TB_VERSION:-4.2.2.5}
    container_name: lsa-eg-tb
    restart: unless-stopped
    depends_on:
      eg-postgres:
        condition: service_healthy
    environment:
      <<: *tb-env
    ports:
      # 本地页面、provision:eg、eg-agent 读本地告警与写设备配置（EG 上只给本机）
      - '127.0.0.1:18080:8080'
      # 排障用；IoT Gateway 在容器网络里直接连 eg-tb:1883
      - '127.0.0.1:11884:1883'
    volumes:
      - eg-tb-data:/data
      - eg-tb-logs:/var/log/thingsboard
    healthcheck:
      # tb-node 镜像里没有 wget / curl / nc，只能用 bash 的 /dev/tcp（子站 B0 踩过）
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /login HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200"']
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s
    networks: [eg]

  mosquitto:
    image: eclipse-mosquitto:${MOSQUITTO_VERSION:-2.1.2}
    container_name: lsa-eg-mosquitto
    restart: unless-stopped
    volumes:
      - ../mosquitto/mosquitto.dev.conf:/mosquitto/config/mosquitto.conf:ro
      - mq-data:/mosquitto/data
    ports:
      # 宿主机上的 eg-agent、emu 连这里（EG 上是 127.0.0.1:1884）
      - '127.0.0.1:11883:1883'
    networks: [eg]

  tb-gateway:
    image: thingsboard/tb-gateway:${TB_GATEWAY_VERSION:-3.8.5}
    container_name: lsa-eg-gateway
    restart: unless-stopped
    depends_on: [mosquitto, eg-tb]
    environment:
      TZ: Asia/Shanghai
    volumes:
      # eg-agent 生成的配置（run/gateway/config，含 .firstlaunch 防止镜像用默认配置覆盖）
      - ../../run/gateway/config:/thingsboard_gateway/config
      # 自定义连接器：EG 自身数据经网关自己的会话上送（extensions/lsa/lsa_self_connector.py）
      - ../tb-gateway/extensions/lsa:/thingsboard_gateway/extensions/lsa:ro
      - gw-logs:/thingsboard_gateway/logs
    networks: [eg]

  # G4：RTSP 测试源扮本柜的双目摄像机（四路按需出测试画面）；仿真器经它的 API 模拟断流
  camera:
    image: bluenviron/mediamtx:${MEDIAMTX_VERSION:-1.21.1}-ffmpeg
    container_name: lsa-eg-camera
    restart: unless-stopped
    command: ['/cfg/camera.yml']
    volumes:
      - ./camera.yml:/cfg/camera.yml:ro
    ports:
      # 宿主机上的 eg-video 探测 / 仿真器断流用（EG_CAM_HOST=127.0.0.1:18555）
      - '127.0.0.1:18555:8554'
      - '127.0.0.1:19998:9997'
    networks: [eg]

  # G4：EG 本机 mediamtx（两级按需拉的 EG 这一级）。配置由 eg-video 生成到 run/mediamtx/mediamtx.yml，变了 mediamtx 自己重载
  # 开发时 RTSP 用 18554（与子站 mediamtx 的 8554 错开），子站 mediamtx 从 host.docker.internal:18554 拉
  mediamtx:
    image: bluenviron/mediamtx:${MEDIAMTX_VERSION:-1.21.1}
    container_name: lsa-eg-mediamtx
    restart: unless-stopped
    depends_on: [camera]
    command: ['/cfg/mediamtx.yml']
    volumes:
      - ../../run/mediamtx:/cfg
      # G5：循环录像（两路子码流常录，按 evidence.ringHours 自动删最旧的）
      - ../../run/recordings:/recordings
    ports:
      - '127.0.0.1:18554:18554'
      - '127.0.0.1:19997:9997'
      # G5：回放服务（agent 裁证据片段）
      - '127.0.0.1:19996:9996'
      # eg-ui-v2：本地管理页实时画面（agent 反代 WHEP / HLS）；WebRTC 媒体 UDP 8190（8189 是子站 mediamtx 的）
      - '127.0.0.1:18889:8889'
      - '127.0.0.1:18888:8888'
      - '127.0.0.1:8190:8190/udp'
    networks: [eg]

volumes:
  eg-pg:
  eg-tb-data:
  eg-tb-logs:
  gw-logs:
  mq-data:

networks:
  eg:
    name: lsa-eg-dev
